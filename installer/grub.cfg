# Pulpo Preview — UEFI GRUB configuration (draft, not yet boot-tested)
#
# Place on the installer ISO at /boot/grub/grub.cfg (EFI System
# Partition, alongside the signed shim/grubx64.efi for Secure Boot).
# Background: installer/assets/pulpo-uefi-boot-splash.bmp
# (1920x1080, 24-bit BMP — the format GRUB's gfxterm reads; the PNG
# original is installer/assets/pulpo-uefi-boot-splash-1920x1080.png).
#
# NOT YET PROVEN: Secure Boot signing (shim + MOK), the live ISO
# build itself, or a boot test on the Protectli VP6630. Do not
# present this as a working bootable ISO until those are done.

set timeout=5
set default=0

insmod gfxterm
insmod png
insmod jpeg
terminal_output gfxterm
set gfxmode=1920x1080,auto
set gfxpayload=keep

# Boot splash shown while GRUB waits. Falls back to text if the
# background file is missing; boot must never depend on the image.
if [ -f /boot/grub/pulpo-uefi-boot-splash.bmp ]; then
  background_image /boot/grub/pulpo-uefi-boot-splash.bmp
fi

menuentry "Install Pulpo Preview 0.1.0-preview.4" --class pulpo {
  linux /casper/vmlinuz boot=casper quiet splash ---
  initrd /casper/initrd
}

menuentry "Try Pulpo Preview 0.1.0-preview.4 (live, no install)" --class pulpo {
  linux /casper/vmlinuz boot=casper quiet splash ---
  initrd /casper/initrd
}

menuentry "Check installer media" --class pulpo {
  linux /casper/vmlinuz boot=casper integrity-check quiet splash ---
  initrd /casper/initrd
}
