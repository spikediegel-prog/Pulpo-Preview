---
# Pulpo Preview — Calamares shellprocess instance: dev/test-only
# setup for the --dev ISO (xrdp + openssh-server + tailscale,
# corrected dev customer config, hatch SSH public key, evidence
# dir).
#
# dontChroot: true — runs in the LIVE session (not inside the
# target chroot) with ${ROOT} set to the target mount point. The
# script chroots into the target itself to install the dev bundle
# .debs with dpkg, so maintainer scripts run against the target. Must run AFTER
# unpackfs (the target must exist) and AFTER users (the first
# user must exist — the SSH key and the evidence dir are owned
# by that user) and AFTER shellprocess@pulpo-config (the dev
# config intentionally overrides any live Guided Setup config).
# It refuses to run unless the DEV-BUILD marker exists in the
# live image, so a clean (release) image can never run it — and
# the clean settings.conf does not register this instance at
# all. Only installer/calamares/settings-dev.conf (shipped by
# the --dev build) registers it.
#
# timeout: 600 — dpkg -i of the dev bundle (xrdp + openssh-server
# + tailscale closures) plus dpkg --configure -a and the config
# import. Seconds on real hardware; generous under TCG, where
# maintainer scripts (font caches, ldconfig) are slower.
dontChroot: true
timeout: 600
script:
    - /usr/share/pulpo-installer/calamares/dev-setup.sh ${ROOT}
