---
# Pulpo Preview — Calamares grubcfg module.
# Copied from calamares-settings-ubuntu-common (Ubuntu 24.04).
# overwrite false: do not overwrite an existing grub.cfg in the
# target (there is none on a fresh install; this is the safe
# default). GRUB_ENABLE_CRYPTODISK true so a LUKS install (a
# future step) would still boot.
overwrite: false
defaults:
    GRUB_ENABLE_CRYPTODISK: true
