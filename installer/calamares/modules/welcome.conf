---
# Pulpo Preview — Calamares welcome module.
#
# Requirements are checked before the install starts. The internet
# check is DELIBERATELY absent: the live session is offline by
# default and an unset gateway (no internet) is a valid, deliberate
# choice, so the installer must never demand or nudge toward a
# network connection. GeoIP is disabled (style "none") for the
# same reason — no network lookup at install time.
showSupportUrl:         false
showKnownIssuesUrl:     false
showReleaseNotesUrl:    false
showDonateUrl:          false

requirements:
    requiredStorage:    16
    requiredRam:        0.5

    check:
        - storage
        - ram
        - power
        - root
    required:
        - root
        - storage
        - ram

# GeoIP is effectively disabled by setting style to "none"
geoip:
    style:  "none"
    url:    "https://geoip.ubuntu.com/lookup"
    selector: "CountryCode"
