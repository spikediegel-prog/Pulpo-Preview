---
# Pulpo Preview — Calamares users module.
#
# One admin user, sudo group, bash shell, no root password, no
# autologin. The user is created with UID 1000; the pulpo-config
# module finds that user from the target's /etc/passwd and puts
# the customer config in their profile. Adapted from Lubuntu's
# users.conf (Ubuntu 24.04 settings); the only changes are the
# comment and allowActiveDirectory kept (harmless on a
# non-domain machine).
doAutologin: false
setRootPassword: false
sudoersGroup: sudo
defaultGroups:
    - adm
    - cdrom
    - dip
    - lpadmin
    - plugdev
    - name: sambashare
      must_exist: false
      system: true
    - sudo
passwordRequirements:
    minLength: 1
    maxLength: -1
user:
  shell: /bin/bash
  forbidden_names: [ root ]
allowActiveDirectory: true
