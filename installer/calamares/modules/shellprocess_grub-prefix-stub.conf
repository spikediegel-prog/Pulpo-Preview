---
# Pulpo Preview — Calamares shellprocess instance: write the
# GRUB prefix redirect stub for Ubuntu's signed GRUB.
#
# dontChroot: true — runs in the LIVE session (not inside the
# target chroot) with ${ROOT} set to the target mount point. The
# script writes $ROOT/boot/efi/EFI/ubuntu/grub.cfg, a stub that
# points the signed GRUB (whose config prefix is baked in as
# /EFI/ubuntu) at the real menu in /boot/grub/grub.cfg. Must run
# AFTER bootloader (the step that installs shim + GRUB and
# writes the ESP layout) and BEFORE umount (which unmounts the
# ESP). Without it, both the NVRAM entry and the fallback drop
# to a grub> shell (run 10).
dontChroot: true
timeout: 60
script:
    - /usr/share/pulpo-installer/calamares/grub-prefix-stub.sh ${ROOT}
