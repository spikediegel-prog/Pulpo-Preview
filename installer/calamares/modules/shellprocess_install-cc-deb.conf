---
# Pulpo Preview — Calamares shellprocess instance: install the
# signed Control Center release .deb into the installed system.
#
# dontChroot: true — runs in the LIVE session (not inside the
# target chroot) with ${ROOT} set to the target mount point. The
# script verifies the signed release with the Control Center's
# own ubuntu_release.py verify first, then chroots into the
# target itself to install the bundle .debs with dpkg, so
# maintainer scripts run against the target. Must run AFTER
# unpackfs (the target must exist) and BEFORE initramfscfg /
# initramfs: the installed system must carry the verified signed
# build, and a verification or install failure must fail the
# install loudly instead of shipping a system whose Control
# Center has no version record and no signature behind it.
#
# timeout: 600 — dpkg -i of the bundle (Control Center + its
# 13 dependency .debs) plus dpkg --configure -a and the GPG /
# hash verification. Seconds on real hardware; generous under
# TCG, where maintainer scripts (font caches, ldconfig) are
# slower.
dontChroot: true
timeout: 600
script:
    - /usr/share/pulpo-installer/calamares/install-cc-deb.sh ${ROOT}
