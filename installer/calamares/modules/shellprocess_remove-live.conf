---
# Pulpo Preview — Calamares shellprocess instance: strip
# live-only packages from the installed system.
#
# dontChroot: true — runs in the LIVE session (not inside the
# target chroot) with ${ROOT} set to the target mount point. The
# script chroots into the target itself to purge casper with
# dpkg, so the package's maintainer scripts run against the
# target. Must run BEFORE initramfscfg/initramfs: the initramfs
# step regenerates the target's initrd, and with casper still
# installed that initrd probes for a live medium and drops to an
# (initramfs) shell on first boot (run 10).
dontChroot: true
timeout: 120
script:
    - /usr/share/pulpo-installer/calamares/remove-live-packages.sh ${ROOT}
