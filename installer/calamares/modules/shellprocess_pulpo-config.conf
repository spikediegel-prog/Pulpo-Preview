---
# Pulpo Preview — Calamares shellprocess instance: apply the
# customer config to the installed system.
#
# dontChroot: true — runs in the LIVE session (not inside the
# target chroot) with ${ROOT} set to the target mount point. The
# script copies the wizard's config JSON into the target and runs
# `pulpo-control-center config import --root ${ROOT}
# --apply-network` against it. The import is installer-safe by
# design: with --root != / it writes the target's system files
# and never restarts the live system's services or applies
# netplan to the live session.
dontChroot: true
timeout: 120
script:
    - /usr/share/pulpo-installer/calamares/pulpo-config-install.sh ${ROOT}
