---
# Pulpo Preview — Calamares bootloader module.
#
# EFI install with GRUB + Ubuntu's signed shim. efiBootloaderId
# "pulpo" makes the UEFI boot entry and the ESP directory
# /boot/efi/EFI/pulpo/ — the installed system boots as Pulpo, not
# as a generic Ubuntu. The shim and grub binaries themselves are
# Ubuntu's signed ones from the base image (already in the live
# system); no Pulpo key is generated or enrolled — that decision
# is still open.
efiBootLoader: "grub"

kernel: "/vmlinuz-linux"
img: "/initramfs-linux.img"
fallback: "/initramfs-linux-fallback.img"
timeout: "10"

grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"

efiBootloaderId: "pulpo"
