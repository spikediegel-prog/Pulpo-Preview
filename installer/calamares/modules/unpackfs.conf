---
# Pulpo Preview — Calamares unpackfs module.
#
# The live system is ONE squashfs file, /cdrom/casper/filesystem.squashfs.
# The Ubuntu 24.04.5 base ISO ships 21 layered squashfs files
# (minimal + minimal.standard + language layers), and Calamares used
# to copy them one by one — but rsync cannot copy overlay whiteouts,
# and one layer (minimal.no-languages.squashfs, 3,808 whiteouts)
# killed the install with rsync error 13 (see
# installer/DISK-INSTALLER.md "The whiteout failure"). So the build
# (installer/build-iso.sh, step 3) merges the 21 layers at build
# time into a single filesystem.squashfs, Lubuntu-style: the overlay
# resolves the whiteouts during the merge, so the single file has
# none and unpackfs' one rsync copies a coherent filesystem.
#
# Do NOT "fix" a future copy failure by excluding whiteout paths
# from the rsync: a path that is a whiteout in one layer can be a
# real file in a later layer, so a blanket exclude can omit files
# that should be present; only the ordered merge respects that.
#
# If the file were missing, unpackfs would fail the install at the
# mount step — that is the loud failure, not a silent partial copy.
unpack:
    -   source: "/cdrom/casper/filesystem.squashfs"
        sourcefs: "squashfs"
        destination: ""
