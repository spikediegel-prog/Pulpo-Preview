---
# Pulpo Preview — Calamares unpackfs module.
#
# Ubuntu 24.04.5 desktop has NO single top-level squashfs image:
# the live system is 21 layered squashfs files (3 base layers +
# language layers). The flavour settings packages (Lubuntu, Ubuntu
# Unity) still reference the single-layer path because their ISOs
# are built single-layer; that path does not exist on this base
# and would fail the install outright.
#
# The sources below are ALL of /cdrom/casper/*.squashfs, in
# alphabetical order. That order reproduces the live session:
# casper's setup_overlay() globs the files alphabetically and
# prepends each to its overlay lowerdir list, so the last file
# alphabetically is topmost; unpackfs copies in config order with
# later copies overwriting earlier ones, so alphabetical order
# here puts the topmost layer last. The layers are built as diffs
# (each file lives in exactly one layer), so the order only matters
# for the few files present in more than one layer.
#
# Verified against the base ISO (xorriso -find /casper): all 21
# files exist. If a listed file were missing, unpackfs would fail
# the install at the mount step — that is the loud failure, not a
# silent partial copy.
unpack:
    -   source: "/cdrom/casper/minimal.de.squashfs"
        sourcefs: "squashfs"
        destination: ""
    -   source: "/cdrom/casper/minimal.en.squashfs"
        sourcefs: "squashfs"
        destination: ""
    -   source: "/cdrom/casper/minimal.es.squashfs"
        sourcefs: "squashfs"
        destination: ""
    -   source: "/cdrom/casper/minimal.fr.squashfs"
        sourcefs: "squashfs"
        destination: ""
    -   source: "/cdrom/casper/minimal.it.squashfs"
        sourcefs: "squashfs"
        destination: ""
    -   source: "/cdrom/casper/minimal.no-languages.squashfs"
        sourcefs: "squashfs"
        destination: ""
    -   source: "/cdrom/casper/minimal.pt.squashfs"
        sourcefs: "squashfs"
        destination: ""
    -   source: "/cdrom/casper/minimal.ru.squashfs"
        sourcefs: "squashfs"
        destination: ""
    -   source: "/cdrom/casper/minimal.squashfs"
        sourcefs: "squashfs"
        destination: ""
    -   source: "/cdrom/casper/minimal.standard.de.squashfs"
        sourcefs: "squashfs"
        destination: ""
    -   source: "/cdrom/casper/minimal.standard.en.squashfs"
