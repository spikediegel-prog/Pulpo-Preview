---
# Pulpo Preview — Calamares partition module.
#
# v1 is an erase-disk install (the choice page defaults to it).
# Manual partitioning is present in the UI (standard Calamares)
# but is NOT the tested path in v1 — see
# installer/DISK-INSTALLER.md; the tested path is erase-disk on a
# blank or expendable disk. LUKS is off in v1 (a documented next
# step): enabling it adds a passphrase step the install test does
# not cover, and the appliance's evidence store is local and
# short-lived by design.
efiSystemPartition: "/boot/efi"
efiSystemPartitionSize: 300MiB
# Automated (erase-disk) layout. REQUIRED: without a partitionLayout
# entry for "/", Calamares creates only the EFI system partition
# and leaves the rest of the disk as free space — the mount module
# then has no root partition to mount, unpackfs rsyncs into a
# directory on the live session's RAM overlay, and the install
# fails (rsync error 13 once the overlay fills). The root entry
# takes 100% of the remaining space after the EFI partition.
# filesystem "unknown" means "use defaultFileSystemType" (ext4).
partitionLayout:
    - name: "pulpo_root"
      filesystem: unknown
      mountPoint: "/"
      size: 100%
enableLuksAutomatedPartitioning: false
luksGeneration: luks2
userSwapChoices:
    - none
    - file
initialSwapChoice: file
drawNestedPartitions: true
defaultFileSystemType: "ext4"
availableFileSystemTypes: ["ext4", "btrfs", "xfs"]
initialPartitioningChoice: "erase"
