---
# Pulpo Preview — Calamares displaymanager module.
#
# Ubuntu Desktop 24.04 uses gdm (gdm3) with the "ubuntu" GNOME
# session. Lubuntu's config (sddm + lxqt) does not apply here.
# The displaymanager module enables the gdm service in the target
# and records the default session; the installed system boots to
# the gdm login, then the GNOME desktop.
displaymanagers:
  - gdm

defaultDesktopEnvironment:
    executable: "gnome-session"
    desktopFile: "ubuntu"

basicSetup: false
sysconfigSetup: false
