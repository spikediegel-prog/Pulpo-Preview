---
# Pulpo Preview — Calamares shellprocess instance: gate the
# built initrd.
#
# dontChroot: true — runs in the LIVE session (not inside the
# target chroot) with ${ROOT} set to the target mount point. The
# script lists every /boot/initrd.img-* in the target with
# lsinitramfs and fails the install if any of them contains
# casper boot logic. Must run AFTER initramfs (the step that
# builds the image) and BEFORE grubcfg/bootloader: a casper
# initrd must fail the install loudly instead of shipping a
# system that drops to an (initramfs) shell on first boot
# (run 10).
#
# timeout: 1200 — the gate is a safety check, not a fast path.
# One lsinitramfs pass over the ~90 MB initrd takes ~5.7 min
# under TCG (decompression-bound; seconds on real hardware), and
# the old 60 s timeout killed the gate mid-run in run 11 (the
# two-pass gate then took 11m28s). 1200 s is ~3.5x the
# single-pass TCG cost; do not lower it below ~10 min while TCG
# is the only test environment.
dontChroot: true
timeout: 1200
script:
    - /usr/share/pulpo-installer/calamares/verify-initramfs.sh ${ROOT}
