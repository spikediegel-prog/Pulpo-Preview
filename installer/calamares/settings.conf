---
# Pulpo Preview — Calamares settings (installer/disk-installer).
#
# Module sequence for the erase-disk installer (v1). The install
# surface is Calamares' own: welcome, keyboard, partition, users,
# summary. The Pulpo config surface is the 6-step wizard (Welcome,
# Time servers, Timezone, Network, Storage, Summary) run BEFORE the
# installer in the live session (Control Center Guided Setup); the
# installer carries those answers through with the pulpo-config
# shellprocess module below — it does not collect them twice.
#
# Deliberate skips (see installer/DISK-INSTALLER.md):
#   - locale: v1 is English-only; the system timezone stays UTC by
#     design and the display timezone lives in the customer config.
#   - networkcfg: the Pulpo config is the network authority (it
#     writes /etc/netplan/60-pulpo.yaml); networkcfg would fight it.
#   - packages / automirror / pkgselect: nothing to install or
#     remove post-install; the image is the deliverable, and the
#     live session is offline by default.
#   - oemid / luksbootkeyfile / localecfg: not used in v1.
modules-search: [ local ]

instances:
- id: pulpo-config
  module: shellprocess
  config: shellprocess_pulpo-config.conf

sequence:
- show:
  - welcome
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - keyboard
  - users
  - displaymanager
  - hwclock
  - shellprocess@pulpo-config
  - initramfscfg
  - initramfs
  - grubcfg
  - bootloader
  - umount
- show:
  - finished

branding: pulpo
# The user launched "Install Pulpo Preview" on purpose; confirm
# once before anything is written to disk.
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
