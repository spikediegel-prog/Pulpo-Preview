name: Ubuntu Linux Source Attestation

on:
  push:
    tags:
      - "pulpo-linux-v*"

permissions:
  contents: read

jobs:
  verify-and-attest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # Immutable action commit pins: checkout v4, setup-python v5,
      # attest-build-provenance v2, and upload-artifact v4.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Require exact, clean tagged source
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_TYPE}" = "tag"
          case "${GITHUB_REF_NAME}" in
            pulpo-linux-v*) ;;
            *) echo "unexpected Linux release tag" >&2; exit 1 ;;
          esac
          test -z "$(git status --porcelain --untracked-files=all)"
          printf 'tag=%s\ncommit=%s\n' "${GITHUB_REF_NAME}" "${GITHUB_SHA}"

      - name: Install pinned authority verifier dependency
        run: |
          mkdir -p "${RUNNER_TEMP}/pulpo-ci-evidence"
          python -m pip install '.[authority]'
          python -m pip check
          python -m pip freeze > "${RUNNER_TEMP}/pulpo-ci-evidence/pip-freeze.txt"

      - name: Run exact-source test suite
        run: |
          set -o pipefail
          python -W error -m unittest discover -s tests -v 2>&1 \
            | tee "${RUNNER_TEMP}/pulpo-ci-evidence/full-test-suite.log"

      - name: Run randomized constitutional sequence
        run: |
          set -o pipefail
          python -W error -m unittest tests.test_constitutional_sequences -v 2>&1 \
            | tee "${RUNNER_TEMP}/pulpo-ci-evidence/constitutional-sequence.log"

      - name: Run constitutional mutation proof
        env:
          REPORT: ${{ runner.temp }}/constitutional-survival.json
        run: |
          set -euo pipefail
          python scripts/run_constitutional_mutations.py --output "${REPORT}" \
            | tee "${RUNNER_TEMP}/pulpo-ci-evidence/constitutional-mutation-proof.log"
          cp "${REPORT}" "${RUNNER_TEMP}/pulpo-ci-evidence/constitutional-survival.json"
          python - "${REPORT}" <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if report.get("result") != "pass":
              raise SystemExit("constitutional mutation proof did not pass")
          if report.get("mutations_invalid") != 0 or report.get("mutations_survived") != 0:
              raise SystemExit("invalid or surviving mutations found")
          print(
              f"mutations={report['mutations_total']} "
              f"killed={report['mutations_killed']} "
              f"invalid={report['mutations_invalid']} "
              f"survived={report['mutations_survived']}"
          )
          PY

      - name: Confirm mutation proof restored the exact source tree
        run: |
          test -z "$(git status --porcelain --untracked-files=all)"
          git diff --check

      - name: Build exact-commit source archive and manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp -a "${RUNNER_TEMP}/pulpo-ci-evidence" dist/ci-evidence
          archive="dist/pulpo-linux-source-${GITHUB_SHA}.tar.gz"
          git archive --format=tar.gz --prefix="pulpo-${GITHUB_SHA}/" "${GITHUB_SHA}" -o "${archive}"
          archive_sha256="$(sha256sum "${archive}" | cut -d ' ' -f 1)"
          python - "${archive}" "${archive_sha256}" <<'PY'
          import json
          import os
          import platform
          import sys
          from pathlib import Path

          archive = Path(sys.argv[1])
          manifest = {
              "schema": "pulpo.linux-source-attestation.v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "tag": os.environ["GITHUB_REF_NAME"],
              "commit": os.environ["GITHUB_SHA"],
              "workflow_ref": os.environ["GITHUB_WORKFLOW_REF"],
              "workflow_sha": os.environ["GITHUB_WORKFLOW_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "archive": archive.name,
              "archive_sha256": sys.argv[2],
              "python": platform.python_version(),
              "platform": platform.platform(),
              "optional_test_extra": "pulpo[authority]",
              "dependency_check": "python -m pip check",
              "test_suite": "python -W error -m unittest discover -s tests -v",
              "constitutional_sequence": "python -W error -m unittest tests.test_constitutional_sequences -v",
              "mutation_proof": "scripts/run_constitutional_mutations.py",
              "evidence_files": [
                  "ci-evidence/full-test-suite.log",
                  "ci-evidence/constitutional-sequence.log",
                  "ci-evidence/constitutional-mutation-proof.log",
                  "ci-evidence/constitutional-survival.json",
                  "ci-evidence/pip-freeze.txt",
              ],
              "claim_boundary": (
                  "Exact-source Ubuntu CI evidence only; not a customer deployment, "
                  "provider execution, independent cold reproduction, or certification."
              ),
          }
          Path("dist/linux-source-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(manifest, sort_keys=True))
          PY

      - name: Attest exact source archive provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: dist/pulpo-linux-source-${{ github.sha }}.tar.gz

      - name: Preserve source archive and exact-run evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pulpo-linux-source-${{ github.sha }}
          path: |
            dist/pulpo-linux-source-${{ github.sha }}.tar.gz
            dist/linux-source-manifest.json
            dist/ci-evidence/
            ${{ runner.temp }}/constitutional-survival.json
          if-no-files-found: error
          retention-days: 90
