name: Windows Preview Executable

on:
  pull_request:
    branches: [preview, main]
    paths:
      - "pulpo/**"
      - "scripts/windows_launcher.py"
      - "scripts/build_windows_exe.ps1"
      - "scripts/check_windows_exe.py"
      - "scripts/Install-PulpoPreview.ps1"
      - "scripts/requirements-windows-build.txt"
      - ".github/workflows/windows-preview-exe.yml"
      - "docs/WINDOWS_TUNING_PACKAGE.md"
  push:
    branches: [preview, main]
    paths:
      - "pulpo/**"
      - "scripts/windows_launcher.py"
      - "scripts/build_windows_exe.ps1"
      - "scripts/check_windows_exe.py"
      - "scripts/Install-PulpoPreview.ps1"
      - "scripts/requirements-windows-build.txt"
      - ".github/workflows/windows-preview-exe.yml"
      - "docs/WINDOWS_PREVIEW_EXE.md"
      - "docs/WINDOWS_TUNING_PACKAGE.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Build standalone preview with tuning app
        shell: pwsh
        run: ./scripts/build_windows_exe.ps1
      - name: Test bundled executable
        shell: pwsh
        run: python scripts/check_windows_exe.py dist/windows-tuning-preview/pulpo-preview.exe --installer dist/windows-tuning-preview/Install-PulpoPreview.ps1 --output dist/windows-tuning-preview/smoke-test-report.json --work-dir work/windows-exe-smoke
      - name: Add tester instructions and provenance
        shell: pwsh
        run: |
          $exeHash = (Get-FileHash dist/windows-tuning-preview/pulpo-preview.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$exeHash  pulpo-preview.exe" | Set-Content dist/windows-tuning-preview/SHA256SUMS.txt -Encoding utf8
          "Source commit: $env:GITHUB_SHA" | Set-Content dist/windows-tuning-preview/SOURCE.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: pulpo-preview-windows-x64-${{ github.sha }}
          path: |
            dist/windows-tuning-preview/
            dist/pulpo-preview-tuning-windows.zip
          retention-days: 30
          if-no-files-found: error
